<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231d4ed8'/%3E%3Ctext x='32' y='44' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='34' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<style>
  /* Minimalist editorial theme: one surface color, near-black ink, a single accent used sparingly,
     a strict type/spacing scale, and whitespace doing most of the layout work.
     Contrast: ink #16181d on #fff = 17.9:1; muted #5b6370 on #fff = 5.9:1; accent #1d4ed8 on #fff = 6.7:1. */
  :root{--bg:#ffffff;--ink:#16181d;--muted:#5b6370;--faint:#8b93a1;--line:#e6e8ec;--line-soft:#f0f1f4;--accent:#1d4ed8;--accent-hover:#1534a6;--on-accent:#ffffff;--r:10px;--r-sm:6px;
    --sp-1:8px;--sp-2:16px;--sp-3:24px;--sp-4:40px;--sp-5:64px;--sp-6:96px}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;font-size:1.0625rem;line-height:1.6;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
  a:hover{color:var(--accent-hover)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
  .wrap{max-width:720px;margin:0 auto;padding:0 24px}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .skip-link{position:absolute;left:-9999px;top:0;background:var(--accent);color:var(--on-accent);font-weight:600;padding:10px 16px;border-radius:0 0 var(--r-sm) 0;z-index:100}
  .skip-link:focus{left:0}
  /* nav: quiet, text-only, no chrome until you scroll */
  nav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
  body.scrolled nav{border-bottom-color:var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;min-height:56px}
  nav .name{font-weight:600;font-size:.95rem;color:var(--ink);text-decoration:none}
  nav .links{display:flex;gap:4px}
  nav .links a{display:inline-flex;align-items:center;min-height:40px;color:var(--muted);font-size:.9rem;padding:8px 12px;border-radius:var(--r-sm);text-decoration:none;transition:color .15s}
  nav .links a:hover{color:var(--ink)}
  /* hero: generous air, one clear statement, modest type scale (no oversized display type) */
  header{padding:var(--sp-6) 0 var(--sp-5)}
  .eyebrow{color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:.78rem;margin:0 0 var(--sp-2)}
  header h1{margin:0 0 var(--sp-2);font-size:clamp(1.9rem,4.2vw,2.5rem);line-height:1.18;font-weight:700;letter-spacing:-.015em}
  .pitch{margin:0;color:var(--muted);font-size:1.1rem;line-height:1.6;max-width:58ch}
  .meta{margin:var(--sp-3) 0 0;color:var(--faint);font-size:.88rem;line-height:1.6;max-width:62ch}
  .cta{margin-top:var(--sp-4);display:flex;gap:12px;flex-wrap:wrap}
  /* buttons: one filled, one quiet */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 18px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.92rem;font-weight:600;cursor:pointer;text-decoration:none;transition:border-color .15s,background .15s,color .15s}
  .btn:hover{border-color:var(--ink);color:var(--ink);background:var(--line-soft)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}
  /* sections: rhythm comes from spacing + a single hairline, not boxes or alternating fills */
  section{padding:var(--sp-5) 0;scroll-margin-top:56px}
  section + section{border-top:1px solid var(--line)}
  h2{font-size:1.3rem;line-height:1.3;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
  .lead{color:var(--muted);font-size:.95rem;margin:0 0 var(--sp-4)}
  #skills-root{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4) var(--sp-4)}
  .skillgroup h3{font-size:.88rem;font-weight:600;margin:0 0 10px;color:var(--ink)}
  .skillgroup h3 small{color:var(--faint);font-weight:400;font-size:.82rem}
  .badges{display:flex;flex-wrap:wrap;gap:6px}
  .badge{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.8rem;line-height:1.3;color:var(--muted)}
  /* project list: editorial rows, not heavy cards */
  .card{padding:var(--sp-4) 0;border-top:1px solid var(--line)}
  .card:first-child{border-top:0;padding-top:0}
  .card h3{margin:0 0 4px;font-size:1.1rem;line-height:1.35;font-weight:700;color:var(--ink)}
  .card .sub{color:var(--accent);font-size:.82rem;font-weight:600;margin:0 0 14px}
  .card .role{color:var(--faint);font-size:.85rem;margin:0 0 18px}
  .card .role b{color:var(--muted);font-weight:600}
  .star{padding:14px 0}
  .star+.star{border-top:1px solid var(--line-soft)}
  .star>b{display:block;color:var(--faint);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
  .star p{margin:0;color:var(--muted)}
  .points{margin:0;padding-left:18px;color:var(--muted)}
  .points li{margin-bottom:6px}
  .points li:last-child{margin-bottom:0}
  .star .points+.points,.star p+.points{margin-top:10px}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 4px}
  .charts img{width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;border-radius:var(--r-sm);background:#fff;border:1px solid var(--line);padding:6px}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .about p{margin:0 0 16px;max-width:64ch;font-size:1rem;color:var(--muted)}
  footer{padding:var(--sp-4) 0 var(--sp-6);color:var(--faint);font-size:.85rem;border-top:1px solid var(--line)}
  footer .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
  footer a{color:var(--muted)}
  #copy-status{color:var(--muted);font-size:.85rem;min-height:1.2em}
  .sticky{position:fixed;right:20px;bottom:20px;z-index:50;box-shadow:0 8px 24px rgba(22,24,29,.18);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
  .sticky.show{opacity:1;transform:translateY(0);pointer-events:auto}
  @media(max-width:760px){#skills-root{grid-template-columns:1fr;gap:var(--sp-4)}}
  @media(max-width:640px){section{padding:var(--sp-4) 0}header{padding:var(--sp-5) 0 var(--sp-4)}.charts{grid-template-columns:1fr}.wrap{padding:0 18px}}
  @media(max-width:420px){nav .links a{padding:8px 8px;font-size:.85rem}nav .name{font-size:.9rem}}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.sticky,nav{transition:none}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<nav aria-label="Main"><div class="wrap"><span class="name">Elyas Zulqarnain</span>
  <span class="links"><a href="#skills">Skills</a><a href="#projects">Projects</a><a href="#about">About</a><a id="nav-contact" href="#">Contact</a></span>
</div></nav>

<header>
  <div class="wrap">
    <p class="eyebrow">Digital marketing &amp; e-commerce (entry level)</p>
    <h1 id="pitch-name">Elyas Zulqarnain</h1>
    <p class="pitch" id="pitch-text"></p>
    <p class="meta" id="pitch-meta"></p>
    <div class="cta">
      <a class="btn primary" href="#projects">View projects</a>
      <a class="btn" id="pitch-email" href="#">Email me</a>
    </div>
  </div>
</header>

<main id="main">
<section id="skills"><div class="wrap">
  <h2>Skills</h2>
  <p class="lead">An honest view, by area and level.</p>
  <div id="skills-root"></div>
  <noscript><p>This page needs JavaScript to show its content. You can reach me at elyas.careers@gmail.com.</p></noscript>
</div></section>

<section id="projects" class="alt"><div class="wrap">
  <h2>Projects</h2>
  <p class="lead">Each project: my role, the problem, what I did, and the result.</p>
  <div id="projects-root"></div>
</div></section>

<section id="about"><div class="wrap about">
  <h2>About</h2>
  <div id="about-root"></div>
</div></section>
</main>

<footer><div class="wrap" id="footer-root"></div></footer>
<a class="btn primary sticky" id="sticky-contact" href="#">Contact</a>

<script>
/* ===================== EDIT YOUR CONTENT HERE ===================== */
const DATA = {
  profile: {
    name: "Elyas Zulqarnain",
    pitch: "I'm building a career in digital marketing and e-commerce, with a B.Sc. in Marketing and 10+ years of experience in operations, branch management, and school administration. I have foundational skills in digital marketing, e-commerce, and basic data analysis, and working AI fluency that supports each of them.",
    meta: "Fujairah, UAE · B.Sc. Marketing · Google certificates in Data Analytics, Digital Marketing & E-commerce, and Prompting Essentials · No-Code AI for Business Professionals (Sep 2026).",
    email: "elyas.careers@gmail.com",
    github: "https://github.com/elyascareers/elyas-project"
  },
  skills: [
    { group: "Marketing & Administration", level: "10+ years", items: ["Operations management","Branch & school administration","Team leadership","Workflow coordination","Stakeholder management","Customer service","Marketing fundamentals"] },
    { group: "Digital Marketing & E-commerce", level: "foundational, learning by doing", items: ["Content & newsletter marketing","SEO basics","GA4 & Search Console basics","Social scheduling (Metricool)","Ebook store (Payhip)"] },
    { group: "Data Analytics", level: "basic, used to support business decisions", items: ["Excel & Google Sheets","SQL (basic)","Power BI & Power Query (basics)","DAX measures (basic)","Data cleaning","Charts & reporting","Reading performance reports"] },
    { group: "AI Fluency", level: "working / intermediate", items: ["Prompt design","Custom Claude skills I set up with AI","Connectors (MCP) to Gmail, Drive, GitHub & Render","Company knowledge base (RAG), set up & maintained","No-code AI automation (Notion AI, Zapier, Make)","Human-approval workflows","Checking AI output before use"] },
    { group: "No-Code AI Building & Deploying", level: "working", items: ["Building sites & apps by directing AI","Domain & DNS setup (Namecheap)","Hosting (Namecheap cPanel, Render)","GitHub: repos, commits & updates","Updating & redeploying live sites","Testing before launch"] },
    { group: "Tools", level: "working", items: ["MS Office","Google Workspace"] }
  ],
  projects: [
    {
      title: "1 · Simple Titbit (ongoing since July 2026)",
      sub: "Digital marketing & e-commerce · a real project I work on and learn from",
      role: "Hands-on practitioner (learning by doing)",
      situation: "Build an audience and start selling digital products from nothing, with no budget.",
      action: [
        "Run a weekly content plan across a website, a Substack newsletter, and social media, with SEO basics on every post.",
        "Published three ebooks on a Payhip store and promoted them on four platforms.",
        "Track results with GA4, Search Console, and a private dashboard I had built, and review a weekly report to decide what to fix next.",
        "Use AI for drafting; I approve everything before it goes out."
      ],
      result: "24+ website posts and a weekly newsletter so far, with three ebooks on sale. The audience is still small and early results are weak, which has taught me first-hand how traffic, search visibility, and sales connect. I paused social posting on purpose to build a reliable website, newsletter, and ebook pipeline first, and will restart it once those are stable.",
      images: [],
      links: [
        {label:"Website", href:"https://www.simpletitbit.com", primary:true},
        {label:"Newsletter", href:"https://simpletitbit.substack.com"},
        {label:"Ebook store", href:"https://payhip.com/simpletitbit"}
      ]
    },
    {
      title: "2 · Building and running websites and apps with no-code AI",
      sub: "No-code AI · built and deployed by directing AI tools, with no code written by me",
      role: "Product owner and tester; AI tools wrote the code",
      situation: "Small businesses and schools need simple digital tools, and I don't write code.",
      action: [
        "Described what was needed in plain language and directed AI tools (Claude, and Kimi for one app) to build it.",
        "Tested each version in a browser and on a phone, then sent back fixes.",
        "Handled the domain, hosting, GitHub, and redeploy steps with AI guidance.",
        "Kept written guides so any AI tool can continue the work."
      ],
      result: "Four products built and deployed with no code written by me. Earlier prototypes (StockSafe, SafeRent, Stitchbook, and a school management system) are not listed.",
      built: [
        "Simple Titbit website: a static blog on its own domain (simpletitbit.com), with domain and hosting on Namecheap, code on GitHub, and a weekly update routine.",
        "ZenPen website: an online store site for electronics, fashion and beauty, live on its own domain (zenpengh.com), with code on GitHub.",
        "MyStore: an offline-first shop-records app with Google Drive backup, deployed on Render from GitHub, with updates tested on a branch before going live.",
        "Zetranova Finance Portal: a finance, inventory and payroll prototype, deployed on Render from GitHub."
      ],
      images: [],
      links: [
        {label:"MyStore (live app)", href:"https://mystore-kant.onrender.com", primary:true},
        {label:"ZenPen site", href:"https://zenpengh.com"},
        {label:"MyStore code", href:"https://github.com/datatitbit/MyStore"}
      ]
    },
    {
      title: "3 · Cyclistic Bike-Share Analysis",
      sub: "Data analytics · Google Data Analytics capstone, Power BI",
      role: "Analyst (course capstone, completed with guidance)",
      situation: "A bike-share company wanted to understand how casual riders and annual members use its bikes differently, so marketing could convert casual riders into members.",
      action: [
        "Imported Q1 2019 and Q1 2020 trip files into Power Query as separate queries, because their column names differed.",
        "Renamed and standardised columns, removed fields not found in both files, and combined the tables with Append Queries.",
        "Created a ride-length column and removed zero and negative rides, leaving about 791,746 rides.",
        "Wrote two DAX measures (total rides and average ride length) and built a Power BI page comparing riders by ride length, start hour, station and day of week."
      ],
      result: "Casual riders take longer rides and ride more on weekends. Members ride mostly in the morning and evening, which suggests commuting. I wrote four recommendations, including weekend promotions and campaigns at stations popular with casual riders.",
      images: [],
      links: [
        {label:"Read the report", href:"https://github.com/elyascareers/elyas-project/blob/main/data-analytics/05_Share/Cyclistic_Analysis_Report.md", primary:true},
        {label:"Project folder", href:"https://github.com/elyascareers/elyas-project/tree/main/data-analytics"}
      ]
    }
  ],
  about: [
    "I'm Elyas Zulqarnain, an entry-level digital marketing and e-commerce professional with a B.Sc. in Marketing and 10+ years of experience in operations and administration, including roles as a branch manager and school administrator.",
    "My recent focus is building foundational skills in digital marketing, e-commerce, and data analysis, and using AI tools to support that work. I learn by working on real projects, such as Simple Titbit, and I'm open about what is still early or unfinished. Based in Fujairah, UAE, and looking for part-time, remote internships in digital marketing and e-commerce, or in no-code workflow automation."
  ]
};
/* ================================================================= */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isExternal = href => /^https?:\/\//.test(href);
const block = v => Array.isArray(v) ? `<ul class="points">${v.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>` : `<p>${esc(v)}</p>`;
document.getElementById('pitch-name').textContent = DATA.profile.name;
document.getElementById('pitch-text').textContent = DATA.profile.pitch;
document.getElementById('pitch-meta').textContent = DATA.profile.meta;
const mail = "mailto:" + DATA.profile.email;
["pitch-email","sticky-contact","nav-contact"].forEach(id=>document.getElementById(id).href = mail);
document.getElementById('skills-root').innerHTML = DATA.skills.map(g =>
  `<div class="skillgroup"><h3>${esc(g.group)} <small>&mdash; ${esc(g.level)}</small></h3><div class="badges">${
    g.items.map(i=>`<span class="badge">${esc(i)}</span>`).join('')}</div></div>`).join('');
document.getElementById('projects-root').innerHTML = DATA.projects.map(p => `
  <article class="card">
    <h3>${esc(p.title)}</h3>
    <p class="sub">${esc(p.sub)}</p>
    <p class="role"><b>My role:</b> ${esc(p.role)}</p>
    <div class="star"><b>Problem</b><div>${block(p.situation)}</div></div>
    <div class="star"><b>What I did</b><div>${block(p.action)}</div></div>
    <div class="star"><b>Result</b><div>${block(p.result)}${p.built&&p.built.length?block(p.built):''}</div></div>
    ${p.images&&p.images.length?`<div class="charts">${p.images.map(s=>`<img loading="lazy" decoding="async" width="640" height="360" src="${esc(s)}" alt="${esc(p.title)} chart">`).join('')}</div>`:''}
    <div class="btns">${p.links.map(l=>`<a class="btn ${l.primary?'primary':''}" href="${esc(l.href)}"${isExternal(l.href)?' target="_blank" rel="noopener noreferrer"':''}>${esc(l.label)}${isExternal(l.href)?' <span aria-hidden="true">&#8599;</span><span class="sr-only"> (opens in a new tab)</span>':''}</a>`).join('')}</div>
  </article>`).join('');
document.getElementById('about-root').innerHTML = DATA.about.map(t=>`<p>${esc(t)}</p>`).join('');
document.getElementById('footer-root').innerHTML =
  `<span>Email: <a href="${mail}">${esc(DATA.profile.email)}</a></span><span>GitHub: <a href="${esc(DATA.profile.github)}" target="_blank" rel="noopener noreferrer">github.com/elyascareers</a></span><button class="btn" id="copy-email" type="button">Copy email</button><span id="copy-status" role="status" aria-live="polite"></span>`;

/* instant confirmation when the email address is copied */
const copyBtn = document.getElementById('copy-email');
const copyStatus = document.getElementById('copy-status');
copyBtn.addEventListener('click', async () => {
  let ok = false;
  try { await navigator.clipboard.writeText(DATA.profile.email); ok = true; }
  catch (e) {
    try { const t = document.createElement('textarea'); t.value = DATA.profile.email; document.body.appendChild(t); t.select(); ok = document.execCommand('copy'); document.body.removeChild(t); } catch (e2) {}
  }
  copyStatus.textContent = ok ? 'Email address copied.' : 'Could not copy. Please select the address above.';
  copyBtn.textContent = ok ? 'Copied' : 'Copy email';
  setTimeout(() => { copyBtn.textContent = 'Copy email'; copyStatus.textContent = ''; }, 2500);
});

/* show the sticky Contact button only after scrolling past the hero */
const stickyBtn = document.getElementById('sticky-contact');
const heroEl = document.querySelector('header');
const toggleSticky = () => {
  const pastHero = heroEl.getBoundingClientRect().bottom < 0;
  stickyBtn.classList.toggle('show', pastHero);
  document.body.classList.toggle('scrolled', window.scrollY > 4);
};
window.addEventListener('scroll', toggleSticky, {passive:true});
toggleSticky();
</script>
</body>
</html>
