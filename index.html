<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elyas Zulqarnain — Portfolio</title>
<meta name="description" content="Elyas Zulqarnain — marketing and general administrative professional, with hands-on AI fluency and foundational knowledge of digital marketing, e-commerce, and data analytics.">
<link rel="canonical" href="https://elyasprofile.onrender.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="Elyas Zulqarnain — Portfolio">
<meta property="og:description" content="Marketing and general administrative professional, with hands-on AI fluency and foundational knowledge of digital marketing, e-commerce, and data analytics.">
<meta property="og:url" content="https://elyasprofile.onrender.com/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Elyas Zulqarnain — Portfolio">
<meta name="twitter:description" content="Marketing and general administrative professional, with hands-on AI fluency and foundational knowledge of digital marketing, e-commerce, and data analytics.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f1720'/%3E%3Ctext x='32' y='44' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='34' font-weight='700' fill='%23e1812c' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#0f1720;--card:#182430;--ink:#e8eef4;--muted:#9fb0c0;--accent:#e1812c;--line:#26333f;--chip:#1e2b38}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  a{color:#7db6e6;text-decoration:none}a:hover{text-decoration:underline}
  a:focus-visible,.btn:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .wrap{max-width:980px;margin:0 auto;padding:0 20px}
  /* skip link */
  .skip-link{position:absolute;left:-9999px;top:0;background:var(--accent);color:#1a1206;font-weight:600;padding:10px 16px;border-radius:0 0 8px 0;z-index:100}
  .skip-link:focus{left:0}
  /* nav */
  nav{position:sticky;top:0;z-index:40;background:rgba(15,23,32,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
  nav .name{font-weight:700;color:var(--ink)}
  nav .links{display:flex;gap:18px}
  nav .links a{color:var(--muted);font-size:.9rem}
  nav .links a:hover{color:var(--ink);text-decoration:none}
  @media(max-width:560px){nav .links{gap:10px}nav .links a{font-size:.82rem}}
  @media(max-width:400px){nav .links a:nth-child(3){display:none}}
  /* hero */
  header{padding:64px 0 44px;border-bottom:1px solid var(--line)}
  .eyebrow{color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:.8rem;margin:0 0 10px}
  header h1{margin:0 0 14px;font-size:2.3rem;line-height:1.15}
  header h1 .grad{color:var(--accent)}
  .pitch{margin:0;color:var(--muted);font-size:1.12rem;max-width:62ch}
  .meta{margin-top:16px;color:var(--muted);font-size:.92rem}
  .cta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-block;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:.92rem;transition:opacity .15s,transform .15s}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1206;font-weight:600}
  .btn:hover{text-decoration:none;opacity:.92;transform:translateY(-1px)}
  section{padding:46px 0;border-bottom:1px solid var(--line)}
  section:nth-of-type(even){background:rgba(255,255,255,.015)}
  h2{font-size:1.4rem;margin:0 0 6px}
  .lead{color:var(--muted);margin:0 0 22px}
  .skillgroup{margin-bottom:18px}
  .skillgroup h3{font-size:.95rem;margin:0 0 8px}
  .skillgroup h3 small{color:var(--muted);font-weight:400}
  .badges{display:flex;flex-wrap:wrap;gap:8px}
  .badge{background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:.85rem;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:22px}
  .card h3{margin:0 0 4px;font-size:1.2rem}
  .card .sub{color:var(--muted);font-size:.9rem;margin-bottom:16px}
  .star{margin:0 0 6px}
  .star b{display:inline-block;min-width:78px;color:var(--accent);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;vertical-align:top}
  .star span{color:var(--ink)}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0 4px}
  .charts img{width:100%;aspect-ratio:16/9;object-fit:contain;border-radius:8px;background:#fff;padding:6px}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .about p{margin:0 0 14px;max-width:72ch}
  footer{padding:32px 0 90px;color:var(--muted);font-size:.9rem}
  .sticky{position:fixed;right:18px;bottom:18px;z-index:50;background:var(--accent);color:#1a1206;font-weight:600;padding:12px 18px;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:.92rem;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s}
  .sticky.show{opacity:1;transform:translateY(0);pointer-events:auto}
  .sticky:hover{text-decoration:none;opacity:.95}
  @media(max-width:640px){header h1{font-size:1.85rem}.charts{grid-template-columns:1fr}.star b{display:block;min-width:0;margin-bottom:2px}}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.sticky{transition:none}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<nav><div class="wrap"><span class="name">Elyas Zulqarnain</span>
  <span class="links"><a href="#skills">Skills</a><a href="#projects">Projects</a><a href="#about">About</a><a id="nav-contact" href="#">Contact</a></span>
</div></nav>

<header>
  <div class="wrap">
    <p class="eyebrow">Marketing &amp; administrative professional</p>
    <h1 id="pitch-name"></h1>
    <p class="pitch" id="pitch-text"></p>
    <p class="meta" id="pitch-meta"></p>
    <div class="cta">
      <a class="btn primary" href="#projects">View projects</a>
      <a class="btn" id="pitch-email" href="#">Email me</a>
    </div>
  </div>
</header>

<main id="main">
<section id="skills"><div class="wrap">
  <h2>Skills</h2>
  <p class="lead">An honest view, by area and level.</p>
  <div id="skills-root"></div>
</div></section>

<section id="projects"><div class="wrap">
  <h2>Projects</h2>
  <p class="lead">Each project: the problem, what I did, and the result.</p>
  <div id="projects-root"></div>
</div></section>

<section id="about"><div class="wrap about">
  <h2>About</h2>
  <div id="about-root"></div>
</div></section>
</main>

<footer><div class="wrap" id="footer-root"></div></footer>
<a class="sticky" id="sticky-contact" href="#">&#9993; Contact</a>

<script>
/* ===================== EDIT YOUR CONTENT HERE ===================== */
const DATA = {
  profile: {
    name: "Elyas Zulqarnain",
    pitch: "I'm a marketing and general administrative professional with 10+ years of experience in operations, branch management, and school administration. More recently I've built practical, hands-on fluency with AI, and gained foundational knowledge of digital marketing, e-commerce, and data analytics.",
    meta: "Abu Dhabi, UAE · B.Sc. Marketing · Google certificates in Data Analytics and Digital Marketing & E-commerce.",
    email: "elyas.careers@gmail.com",
    github: "https://github.com/elyascareers/elyas-project"
  },
  skills: [
    { group: "Marketing & Administration", level: "10+ years", items: ["Operations management","Branch & school administration","Team leadership","Workflow coordination","Stakeholder management","Customer service","Marketing fundamentals"] },
    { group: "AI & Automation", level: "hands-on / working", items: ["Working with AI tools & agents","Prompt engineering","Custom Claude skills","Connectors (MCP)","AI-assisted workflows","AI safety awareness"] },
    { group: "Foundational (learning)", level: "digital marketing, e-commerce & data", items: ["Power BI (basics)","Excel","SQL (basic)","RFM segmentation","Data cleaning","Digital marketing & e-commerce basics"] },
    { group: "Tools", level: "working", items: ["Git & GitHub","Render","MS Office","Markdown"] }
  ],
  projects: [
    {
      title: "1 · Cyclistic Bike-Share Analysis",
      sub: "Data analytics · Google capstone-style learning project (Power BI)",
      situation: "A bike-share company wanted to understand how casual riders and annual members use the bikes differently.",
      action: "Cleaned and merged trip data from two different schema versions in Power BI, added ride-length and date fields, and visualized the patterns.",
      result: "Members mostly take short weekday trips (commuting) while casual riders take longer weekend/leisure trips — with three membership recommendations.",
      images: ["Final_Output/Charts/03_rides_by_weekday.png","Final_Output/Charts/02_ridelength_by_type.png"],
      links: [
        {label:"View report", href:"https://github.com/elyascareers/elyas-project/blob/main/Final_Output/Cyclistic_Report.md", primary:true},
        {label:"GitHub", href:"https://github.com/elyascareers/elyas-project"}
      ]
    },
    {
      title: "2 · Customer Segmentation (RFM)",
      sub: "Digital marketing / e-commerce · learning project (Power BI)",
      situation: "In a sample dataset, only ~15% of marketing campaigns got a response, so most budget reached people who don't buy.",
      action: "Cleaned ~2,200 customer records and built a basic RFM segmentation (Recency, Frequency, Monetary), grouping customers into five segments.",
      result: "Champions (24% of customers) responded at 30% vs 1% for the least-active group — pointing to focusing budget on top segments and a win-back offer.",
      images: ["digital-marketing/Final_Output/Charts/02_response_by_segment.png","digital-marketing/Final_Output/Charts/01_segment_sizes.png"],
      links: [
        {label:"View report", href:"https://github.com/elyascareers/elyas-project/blob/main/digital-marketing/Final_Output/Marketing_Report.md", primary:true},
        {label:"GitHub", href:"https://github.com/elyascareers/elyas-project/tree/main/digital-marketing"}
      ]
    },
    {
      title: "3 · Working with AI",
      sub: "Hands-on with AI tools & agents",
      situation: "Doing digital work by hand is slow, and AI output needs a human check to be safe and accurate.",
      action: "I set up AI-assisted workflows — using AI agents with a human approval step to help research, build, test, and publish — and created reusable AI skills and connectors.",
      result: "Contributed to building owned products (StockSafe, SafeRent, Zetranova Finance Portal, SocialManager, Stitchbook, a School Management System) and a scheduled content workflow.",
      images: [],
      links: [
        {label:"Read case study", href:"https://github.com/elyascareers/elyas-project/blob/main/ai-project/Final_Output/AI_Report.md", primary:true},
        {label:"How I work with AI", href:"https://github.com/elyascareers/elyas-project/blob/main/ai-project/Documentation/AI_Methodology.md"},
        {label:"GitHub", href:"https://github.com/elyascareers/elyas-project/tree/main/ai-project"}
      ]
    }
  ],
  about: [
    "I'm Elyas Zulqarnain, a marketing and general administrative professional with 10+ years of experience — including roles as a branch manager and school administrator — and a B.Sc. in Marketing.",
    "More recently I've focused on building practical, hands-on fluency with AI, using AI tools and agents to help get real work done. I also hold Google certificates and have foundational, hands-on knowledge of digital marketing, e-commerce, and data analytics through the projects below. Based in Abu Dhabi, UAE, and open to marketing, operations/administration, and AI-related roles."
  ]
};
/* ================================================================= */
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const isExternal = href => /^https?:\/\//.test(href);
document.getElementById('pitch-name').innerHTML = esc(DATA.profile.name).replace(/(\S+)$/, '<span class="grad">$1</span>');
document.getElementById('pitch-text').textContent = DATA.profile.pitch;
document.getElementById('pitch-meta').textContent = DATA.profile.meta;
const mail = "mailto:" + DATA.profile.email;
["pitch-email","sticky-contact","nav-contact"].forEach(id=>document.getElementById(id).href = mail);
document.getElementById('skills-root').innerHTML = DATA.skills.map(g =>
  `<div class="skillgroup"><h3>${esc(g.group)} <small>&mdash; ${esc(g.level)}</small></h3><div class="badges">${
    g.items.map(i=>`<span class="badge">${esc(i)}</span>`).join('')}</div></div>`).join('');
document.getElementById('projects-root').innerHTML = DATA.projects.map(p => `
  <div class="card">
    <h3>${esc(p.title)}</h3><div class="sub">${esc(p.sub)}</div>
    <p class="star"><b>Problem</b><span>${esc(p.situation)}</span></p>
    <p class="star"><b>Action</b><span>${esc(p.action)}</span></p>
    <p class="star"><b>Result</b><span>${esc(p.result)}</span></p>
    ${p.images&&p.images.length?`<div class="charts">${p.images.map(s=>`<img loading="lazy" src="${esc(s)}" alt="${esc(p.title)} chart">`).join('')}</div>`:''}
    <div class="btns">${p.links.map(l=>`<a class="btn ${l.primary?'primary':''}" href="${esc(l.href)}"${isExternal(l.href)?' target="_blank" rel="noopener noreferrer"':''}>${esc(l.label)}${isExternal(l.href)?' <span aria-hidden="true">&#8599;</span>':''}</a>`).join('')}</div>
  </div>`).join('');
document.getElementById('about-root').innerHTML = DATA.about.map(t=>`<p>${esc(t)}</p>`).join('');
document.getElementById('footer-root').innerHTML =
  `Email: <a href="${mail}">${esc(DATA.profile.email)}</a> &nbsp;&middot;&nbsp; GitHub: <a href="${esc(DATA.profile.github)}" target="_blank" rel="noopener noreferrer">github.com/elyascareers</a>`;

/* show sticky Contact button only after scrolling past the hero, to avoid CTA clutter on first view */
const stickyBtn = document.getElementById('sticky-contact');
const heroEl = document.querySelector('header');
const toggleSticky = () => {
  const past = heroEl.getBoundingClientRect().bottom < 0;
  stickyBtn.classList.toggle('show', past);
};
window.addEventListener('scroll', toggleSticky, {passive:true});
toggleSticky();
</script>
</body>
</html>
