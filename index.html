<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f1720'/%3E%3Ctext x='32' y='44' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='34' font-weight='700' fill='%23e1812c' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<style>
  /* Colour roles (60-30-10): background = 60%, text/cards/borders = 30%, orange accent = 10% and ONLY for buttons and links. */
  :root{--bg:#0f1720;--card:#172431;--ink:#eef3f8;--muted:#a9b8c6;--line:#2d3b49;--chip:#1e2d3b;--accent:#e1812c;--accent-hover:#eb9344;--on-accent:#1a1206;--r:10px;--r-sm:8px}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:1.0625rem;line-height:1.65;background:var(--bg);color:var(--ink)}
  a{color:var(--accent);text-decoration:none;text-underline-offset:3px}
  a:hover{text-decoration:underline}
  a:active{opacity:.8}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px}
  .skip-link{position:absolute;left:-9999px;top:0;background:var(--accent);color:var(--on-accent);font-weight:600;padding:10px 16px;border-radius:0 0 var(--r-sm) 0;z-index:100}
  .skip-link:focus{left:0}
  /* nav */
  nav{position:sticky;top:0;z-index:40;background:rgba(15,23,32,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;min-height:60px}
  nav .name{font-weight:700}
  nav .links{display:flex;gap:4px}
  nav .links a{color:var(--muted);font-size:.95rem;padding:10px 12px;border-radius:var(--r-sm)}
  nav .links a:hover{color:var(--accent);text-decoration:none}
  /* hero (Z pattern: name top-left, links top-right, pitch, then actions bottom-left) */
  header{padding:96px 0 72px;border-bottom:1px solid var(--line)}
  .eyebrow{color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;margin:0 0 14px}
  header h1{margin:0 0 20px;font-size:clamp(2.2rem,5.5vw,3.4rem);line-height:1.08;font-weight:800;letter-spacing:-.02em}
  .pitch{margin:0;color:var(--muted);font-size:1.2rem;line-height:1.6;max-width:60ch}
  .meta{margin:20px 0 0;color:var(--muted);font-size:.95rem;max-width:70ch}
  .cta{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap}
  /* buttons: one style for every button */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 20px;border-radius:var(--r);border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
  .btn:hover{border-color:var(--accent);text-decoration:none}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  /* sections */
  section{padding:72px 0;border-bottom:1px solid var(--line);scroll-margin-top:60px}
  h2{font-size:1.85rem;line-height:1.2;font-weight:700;margin:0 0 8px;letter-spacing:-.01em}
  .lead{color:var(--muted);font-size:1.05rem;margin:0 0 36px}
  #skills-root{display:grid;grid-template-columns:repeat(2,1fr);gap:32px 48px}
  .skillgroup h3{font-size:1.05rem;font-weight:600;margin:0 0 10px}
  .skillgroup h3 small{color:var(--muted);font-weight:400;font-size:.9rem}
  .badges{display:flex;flex-wrap:wrap;gap:8px}
  .badge{background:var(--chip);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 12px;font-size:.9rem;color:var(--ink)}
  /* project cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:32px;margin-bottom:28px}
  .card h3{margin:0 0 6px;font-size:1.35rem;line-height:1.3;font-weight:700}
  .card .sub{color:var(--muted);font-size:.95rem;margin:0 0 6px}
  .card .role{color:var(--muted);font-size:.95rem;margin:0 0 22px}
  .card .role b{color:var(--ink)}
  .star{display:grid;grid-template-columns:120px 1fr;gap:4px 20px;padding:16px 0;border-top:1px solid var(--line)}
  .star>b{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;padding-top:5px}
  .star p{margin:0}
  .points{margin:0;padding-left:20px}
  .points li{margin-bottom:6px}
  .points li:last-child{margin-bottom:0}
  .star .points+.points,.star p+.points{margin-top:12px}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:8px 0 4px}
  .charts img{width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;border-radius:var(--r-sm);background:#fff;padding:6px}
  .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
  .about p{margin:0 0 16px;max-width:68ch;font-size:1.05rem}
  footer{padding:40px 0 100px;color:var(--muted);font-size:.95rem}
  footer .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
  #copy-status{color:var(--ink);font-size:.9rem;min-height:1.2em}
  .sticky{position:fixed;right:18px;bottom:18px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s}
  .sticky.show{opacity:1;transform:translateY(0);pointer-events:auto}
  @media(max-width:760px){#skills-root{grid-template-columns:1fr;gap:28px}.star{grid-template-columns:1fr;gap:6px}.card{padding:24px 20px}}
  @media(max-width:640px){section{padding:52px 0}header{padding:64px 0 48px}.charts{grid-template-columns:1fr}.wrap{padding:0 18px}}
  @media(max-width:420px){nav .links a{padding:10px 8px;font-size:.88rem}nav .name{font-size:.95rem}}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.sticky{transition:none}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<nav aria-label="Main"><div class="wrap"><span class="name">Elyas Zulqarnain</span>
  <span class="links"><a href="#skills">Skills</a><a href="#projects">Projects</a><a href="#about">About</a><a id="nav-contact" href="#">Contact</a></span>
</div></nav>

<header>
  <div class="wrap">

</div></section>

<footer><div class="wrap" id="footer-root"></div></footer>
<a class="btn primary sticky" id="sticky-contact" href="#">Contact</a>

<script>
/* ===================== EDIT YOUR CONTENT HERE ===================== */
const DATA = {
  profile: {
    name: "Elyas Zulqarnain",
    pitch: "I'm a marketing and administrative professional with 10+ years of experience in operations, branch management, and school administration. I have foundational skills in digital marketing, e-commerce, and basic data analysis, and working AI fluency that supports each of them.",
    meta: "Abu Dhabi, UAE · B.Sc. Marketing · Google certificates in Data Analytics, Digital Marketing & E-commerce, and Prompting Essentials · No-Code AI for Business Professionals (Sep 2026).",
    email: "elyas.careers@gmail.com",
    github: "https://github.com/elyascareers/elyas-project"
  },
  skills: [
    { group: "Marketing & Administration", level: "10+ years", items: ["Operations management","Branch & school administration","Team leadership","Workflow coordination","Stakeholder management","Customer service","Marketing fundamentals"] },
    { group: "Digital Marketing & E-commerce", level: "foundational, learning by doing", items: ["Content & newsletter marketing","SEO basics","GA4 & Search Console basics","Social scheduling (Metricool)","Ebook store (Payhip)","RACE framework"] },
    { group: "Data Analytics", level: "basic, used to support business decisions", items: ["Excel & Google Sheets","SQL (basic)","Power BI (basics)","Data cleaning","Charts & reporting","Reading performance reports"] },
    { group: "AI Fluency", level: "working / intermediate", items: ["Prompt design","Custom Claude skills & connectors","Knowledge base (RAG) setup","No-code AI automation (Notion AI, Zapier, Make)","Human-approval workflows","Checking AI output before use"] },
    { group: "No-Code AI Building & Deploying", level: "working", items: ["Building sites & apps by directing AI","Domain & DNS setup (Namecheap)","Hosting (Namecheap cPanel, Render)","GitHub: repos, commits & updates","Updating & redeploying live sites","Testing before launch"] },
    { group: "Tools", level: "working", items: ["MS Office","Google Workspace"] }
  ],
  projects: [
    {
      title: "1 · Simple Titbit (ongoing since July 2026)",
      sub: "Digital marketing & e-commerce · a real project I run and learn from",
      role: "Owner and operator (solo)",
      situation: "Build an audience and start selling digital products from nothing, with no budget.",
      action: [
        "Run a weekly content plan across a website, a Substack newsletter, and social media, with SEO basics on every post.",
        "Published three ebooks on a Payhip store and promoted them on four platforms.",
        "Track results with GA4, Search Console, and a private dashboard I had built, and review a weekly report to decide what to fix next.",
        "Use AI for drafting; I approve everything before it goes out."
      ],
      result: "24+ website posts and a weekly newsletter so far, with three ebooks on sale. The audience is still small and early results are weak, which has taught me first-hand how traffic, search visibility, and sales connect. I paused social posting on purpose to build a reliable website, newsletter, and ebook pipeline first, and will restart it once those are stable.",
      images: [],
      links: [
        {label:"Website", href:"https://www.simpletitbit.com", primary:true},
        {label:"Newsletter", href:"https://simpletitbit.substack.com"},
        {label:"Ebook store", href:"https://payhip.com/simpletitbit"}
      ]
    },
    {
      title: "2 · Building and running websites and apps with no-code AI",
      sub: "No-code AI · built and deployed by directing AI tools, with no code written by me",
      role: "Product owner and tester; AI tools wrote the code",
      situation: "Small businesses and schools need simple digital tools, and I don't write code.",
      action: [
        "Described what was needed in plain language and directed AI tools (Claude, and Kimi for one app) to build it.",
        "Tested each version in a browser and on a phone, then sent back fixes.",
        "Handled the domain, hosting, GitHub, and redeploy steps with AI guidance.",
        "Kept written guides so any AI tool can continue the work."
      ],
      result: "Four products built and deployed with no code written by me. Earlier prototypes (StockSafe, SafeRent, Stitchbook, and a school management system) are not listed.",
      built: [
        "Simple Titbit website: a static blog on its own domain (simpletitbit.com), with domain and hosting on Namecheap, code on GitHub, and a weekly update routine.",
        "ZenPen website: an online store site for electronics, fashion and beauty, live on its own domain (zenpengh.com), with code on GitHub.",
        "MyStore: an offline-first shop-records app with Google Drive backup, deployed on Render from GitHub, with updates tested on a branch before going live.",
        "Zetranova Finance Portal: a finance, inventory and payroll prototype, deployed on Render from GitHub."
      ],
      images: [],
      links: [
        {label:"MyStore (live app)", href:"https://mystore-kant.onrender.com", primary:true},
        {label:"ZenPen site", href:"https://zenpengh.com"},
        {label:"MyStore code", href:"https://github.com/datatitbit/MyStore"}
      ]
    },
    {
      title: "3 · Cyclistic Bike-Share Analysis",
      sub: "Data analytics · Google capstone, a learning project in Power BI",
      role: "Analyst (learning project)",
      situation: "A bike-share company wanted to understand how casual riders and annual members use the bikes differently.",
      action: [
        "Cleaned and merged trip data from two different schema versions in Power BI.",
        "Added ride-length and date fields.",
        "Built charts comparing member and casual riders."
      ],
      result: "Members mostly take short weekday trips (commuting) while casual riders take longer weekend and leisure trips, with three membership recommendations.",
      images: ["Final_Output/Charts/03_rides_by_weekday.png","Final_Output/Charts/02_ridelength_by_type.png"],
      links: [
        {label:"View report", href:"https://github.com/elyascareers/elyas-project/blob/main/Final_Output/Cyclistic_Report.md", primary:true},
        {label:"GitHub", href:"https://github.com/elyascareers/elyas-project"}
      ]
    }
  ],
  about: [
    "I'm Elyas Zulqarnain, a marketing and administrative professional with 10+ years of experience, including roles as a branch manager and school administrator, and a B.Sc. in Marketing.",
    "My recent focus is building foundational skills in digital marketing, e-commerce, and data analysis, and using AI tools to support that work. I learn by running real projects, such as Simple Titbit, and I'm open about what is still early or unfinished. Based in Abu Dhabi, UAE, and open to marketing, operations/administration, and AI-related roles."
  ]
};
/* ================================================================= */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isExternal = href => /^https?:\/\//.test(href);
const block = v => Array.isArray(v) ? `<ul class="points">${v.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>` : `<p>${esc(v)}</p>`;
document.getElementById('pitch-name').textContent = DATA.profile.name;
document.getElementById('pitch-text').textContent = DATA.profile.pitch;
document.getElementById('pitch-meta').textContent = DATA.profile.meta;
const mail = "mailto:" + DATA.profile.email;
["pitch-email","sticky-contact","nav-contact"].forEach(id=>document.getElementById(id).href = mail);
document.getElementById('skills-root').innerHTML = DATA.skills.map(g =>
  `<div class="skillgroup"><h3>${esc(g.group)} <small>&mdash; ${esc(g.level)}</small></h3><div class="badges">${
    g.items.map(i=>`<span class="badge">${esc(i)}</span>`).join('')}</div></div>`).join('');
document.getElementById('projects-root').innerHTML = DATA.projects.map(p => `
  <article class="card">
    <h3>${esc(p.title)}</h3>
    <p class="sub">${esc(p.sub)}</p>
    <p class="role"><b>My role:</b> ${esc(p.role)}</p>
    <div class="star"><b>Problem</b><div>${block(p.situation)}</div></div>
    <div class="star"><b>What I did</b><div>${block(p.action)}</div></div>
    <div class="star"><b>Result</b><div>${block(p.result)}${p.built&&p.built.length?block(p.built):''}</div></div>
    ${p.images&&p.images.length?`<div class="charts">${p.images.map(s=>`<img loading="lazy" decoding="async" width="640" height="360" src="${esc(s)}" alt="${esc(p.title)} chart">`).join('')}</div>`:''}
    <div class="btns">${p.links.map(l=>`<a class="btn ${l.primary?'primary':''}" href="${esc(l.href)}"${isExternal(l.href)?' target="_blank" rel="noopener noreferrer"':''}>${esc(l.label)}${isExternal(l.href)?' <span aria-hidden="true">&#8599;</span>':''}</a>`).join('')}</div>
  </article>`).join('');
document.getElementById('about-root').innerHTML = DATA.about.map(t=>`<p>${esc(t)}</p>`).join('');
document.getElementById('footer-root').innerHTML =
  `<span>Email: <a href="${mail}">${esc(DATA.profile.email)}</a></span><span>GitHub: <a href="${esc(DATA.profile.github)}" target="_blank" rel="noopener noreferrer">github.com/elyascareers</a></span><button class="btn" id="copy-email" type="button">Copy email</button><span id="copy-status" role="status" aria-live="polite"></span>`;

/* instant confirmation when the email address is copied */
const copyBtn = document.getElementById('copy-email');
const copyStatus = document.getElementById('copy-status');
copyBtn.addEventListener('click', async () => {
  let ok = false;
  try { await navigator.clipboard.writeText(DATA.profile.email); ok = true; }
  catch (e) {
    try { const t = document.createElement('textarea'); t.value = DATA.profile.email; document.body.appendChild(t); t.select(); ok = document.execCommand('copy'); document.body.removeChild(t); } catch (e2) {}
  }
  copyStatus.textContent = ok ? 'Email address copied.' : 'Could not copy. Please select the address above.';
  copyBtn.textContent = ok ? 'Copied' : 'Copy email';
  setTimeout(() => { copyBtn.textContent = 'Copy email'; copyStatus.textContent = ''; }, 2500);
});

/* show the sticky Contact button only after scrolling past the hero */
const stickyBtn = document.getElementById('sticky-contact');
const heroEl = document.querySelector('header');
const toggleSticky = () => stickyBtn.classList.toggle('show', heroEl.getBoundingClientRect().bottom < 0);
window.addEventListener('scroll', toggleSticky, {passive:true});
toggleSticky();
</script>
</body>
</html>
